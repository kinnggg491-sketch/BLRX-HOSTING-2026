<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BLRX HOSTING 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0a0c12] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#12141c] rounded-2xl p-8 w-full max-w-md border border-red-500/30 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-red-600 to-red-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-cloud-upload-alt text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">BLRX <span class="text-red-400">HOSTING 2026</span></h1>
            <p class="text-gray-400 text-sm mt-1">Premium Hosting Solution</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500/20 border border-red-500 rounded-lg p-3 mb-4 text-red-400 text-sm text-center">
            <i class="fas fa-exclamation-triangle mr-2"></i> {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">Username</label>
                <input type="text" name="username" required 
                    class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-red-500 focus:outline-none transition">
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-[#0c0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-red-500 focus:outline-none transition">
            </div>
            <button type="submit" 
                class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-600 text-white font-bold py-3 rounded-lg transition transform hover:scale-105">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>
        
        <div class="mt-6 space-y-3">
            <div class="flex gap-3">
                <a href="https://t.me/flash_king_DZ" target="_blank" rel="noopener noreferrer"
                   class="flex-1 inline-flex items-center justify-center gap-2 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 hover:border-red-500/60 text-red-400 py-2.5 rounded-lg transition">
                    <i class="fab fa-telegram-plane"></i> Telegram
                </a>
                <a href="https://www.instagram.com/_crayzi_1_9?igsi=Z3h4bzJwODZuMXow" target="_blank" rel="noopener noreferrer"
                   class="flex-1 inline-flex items-center justify-center gap-2 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 hover:border-red-500/60 text-red-400 py-2.5 rounded-lg transition">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
            </div>
            <div class="text-center">
                <p class="text-gray-600 text-xs">
                    <i class="fas fa-shield-alt"></i> Secure Access Only
                </p>
            </div>
        </div>
    </div>
</body>
</html>
